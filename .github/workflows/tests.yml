name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [8.2, 8.3, 8.4]
        laravel: [10, 11, 12, 13]
        include:
          - laravel: 10
            testbench: 8
          - laravel: 11
            testbench: 9
          - laravel: 12
            testbench: 10
          - laravel: 13
            testbench: 11
        exclude:
          - laravel: 10
            php: 8.4
          - laravel: 13
            php: 8.2

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json, pdo, sqlite, pdo_sqlite
          tools: composer:v2
          coverage: none

      # Laravel 10 and 11 are past end of life and every release has a published
      # security advisory, which Composer 2.9+ refuses to install by default.
      # These jobs only prove compatibility; applications should upgrade.
      - name: Allow end-of-life Laravel releases
        if: matrix.laravel <= 11
        run: composer config audit.block-insecure false

      - name: Install dependencies
        run: |
          composer require "orchestra/testbench:^${{ matrix.testbench }}.0" --dev --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: Code style check (Pint)
        if: matrix.php == '8.3' && matrix.laravel == 12
        run: vendor/bin/pint --test

      - name: Run test suite (Pest)
        run: vendor/bin/pest

      - name: Drift detection check (geni:check demonstration)
        run: vendor/bin/testbench geni:check --path=tests/Fixtures/spec/openapi.json
