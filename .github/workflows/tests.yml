name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [8.2, 8.3, 8.4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json, pdo, sqlite, pdo_sqlite
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Code style check (Pint)
        run: vendor/bin/pint --test

      - name: Run test suite (Pest)
        run: vendor/bin/pest

      - name: Drift detection check (geni:check demonstration)
        run: vendor/bin/testbench geni:check --path=tests/Fixtures/spec/openapi.json
